name: Deploy Laravel to EC2

on:
  push:
    branches: [najim]
  workflow_dispatch:

env:
  # The path on your EC2 server where the app will be deployed
  APP_DIR: "/var/www/backend"

jobs:
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: 📦 Install dependencies
        run: composer install --prefer-dist --no-interaction --no-dev --optimize-autoloader --no-scripts

      - name: 🗜️ Create deployment package
        run: |
          mkdir -p deploy
          rsync -av --exclude='.git' --exclude='.github' --exclude='tests' ./ deploy/
          tar -czf deploy.tar.gz -C deploy .

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deploy.tar.gz
          retention-days: 1

  deploy:
    name: 🚀 Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: 🔑 Configure SSH Key
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

      - name: 🚚 Upload to EC2
        run: |
          scp -i private_key.pem -o StrictHostKeyChecking=no \
            deploy.tar.gz ${EC2_USERNAME}@${EC2_HOST}:/tmp/

      - name: ⚙️ Execute Deployment
        # We use EOF (unquoted) to inject the global $APP_DIR from the workflow env.
        # We escape remote variables like \$USER so they run properly on the EC2 instance.
        run: |
          ssh -i private_key.pem -o StrictHostKeyChecking=no ${EC2_USERNAME}@${EC2_HOST} << EOF
            set -e

            echo "📁 Setting up directory: $APP_DIR"
            sudo mkdir -p $APP_DIR
            sudo chown -R \$USER:\$USER $APP_DIR
            cd $APP_DIR
            
            if [ -f "artisan" ]; then
              echo "📦 Creating backup..."
              mkdir -p backups
              TIMESTAMP=\$(date +%Y%m%d_%H%M%S)
              tar --exclude='./backups' -czf backups/backup_\${TIMESTAMP}.tar.gz . 2>/dev/null || true
              # Keep only the latest 5 backups
              ls -t backups/backup_*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm
            fi
            
            echo "📦 Extracting new release..."
            tar --overwrite -xzf /tmp/deploy.tar.gz -C $APP_DIR
            rm /tmp/deploy.tar.gz

            echo "🔐 Updating permissions..."
            sudo chown -R \$USER:\$USER $APP_DIR
            sudo chmod -R 775 storage bootstrap/cache
            
            if [ ! -f .env ]; then
              echo "⚙️ Setting up default .env..."
              cp .env.example .env
              php artisan key:generate
            fi
            
            # Ensure sqlite database file exists to prevent crash
            touch database/database.sqlite
            
            echo "🚀 Running Laravel deployment commands..."
            php artisan optimize:clear
            php artisan migrate --force
            php artisan optimize
          EOF

      - name: 🗑️ Cleanup SSH Key
        if: always()
        run: rm -f private_key.pem

  verify:
    name: 🔍 Verify Deployment
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🌐 Check health status
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Waiting for application to start..."
          sleep 10
          for i in {1..3}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${EC2_HOST} 2>/dev/null || echo "000")
            if [[ "$STATUS" =~ ^(200|301|302|500)$ ]]; then
              echo "✅ App is up! (Status: $STATUS)"
              exit 0
            fi
            echo "⏳ Attempt $i: Status $STATUS. Retrying in 5s..."
            sleep 5
          done
          echo "❌ Verification failed!"
          exit 1

  rollback:
    name: ⏪ Rollback on Failure
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - name: 🔑 Configure SSH Key
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

      - name: 🔄 Execute Rollback
        run: |
          ssh -i private_key.pem -o StrictHostKeyChecking=no ${EC2_USERNAME}@${EC2_HOST} << EOF
            echo "🔄 Starting rollback..."
            cd $APP_DIR
            
            LATEST_BACKUP=\$(ls -t backups/backup_*.tar.gz 2>/dev/null | head -1)
            
            if [ -n "\$LATEST_BACKUP" ]; then
              echo "📂 Restoring from: \$LATEST_BACKUP"
              tar -xzf "\$LATEST_BACKUP" -C $APP_DIR
              
              php artisan optimize:clear
              php artisan optimize
              
              echo "✅ Rollback successful!"
            else
              echo "⚠️ No backup found for rollback."
            fi
          EOF

      - name: 🗑️ Cleanup SSH Key
        if: always()
        run: rm -f private_key.pem
