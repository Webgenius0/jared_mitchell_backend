version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jared_backend_app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/vendor
    depends_on:
      - db
    networks:
      - jared-network

  web:
    image: nginx:alpine
    container_name: jared_backend_web
    restart: unless-stopped
    tty: true
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - jared-network

  db:
    image: mysql:8.0
    container_name: jared_backend_db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: oursocialimage_backend
      MYSQL_USER: oursocialimage_user
      MYSQL_PASSWORD: oursocialimage123456
      MYSQL_ROOT_PASSWORD: oursocialimage123456
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - jared-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jared_backend_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/vendor
    depends_on:
      - app
      - db
    networks:
      - jared-network

volumes:
  dbdata:
    driver: local

networks:
  jared-network:
    driver: bridge
